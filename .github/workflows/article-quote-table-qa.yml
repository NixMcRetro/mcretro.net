name: Article Quote and Table Styling QA
on:
  push:
    branches:
      - test/article-quote-table-qa-2026-11-02
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build Jekyll
        run: bundle exec jekyll build --destination _site
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Responsive browser tests and review screenshots
        run: |
          python3 -m http.server 8784 --directory _site > /tmp/quote-table-server.log 2>&1 &
          node .github/tests/article-quote-table-qa.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xtide-quote-and-table-previews
          path: /tmp/xtide-quote-table-previews
          if-no-files-found: ignore
