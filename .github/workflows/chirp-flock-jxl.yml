name: Import original Channel Chirp flock images as JXL

on:
  push:
    branches:
      - feat/chirp-about-the-flock-profiles-20261122
    paths:
      - .github/workflows/chirp-flock-jxl.yml
      - scripts/import-chirp-flock-images.sh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working feature branch
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Install JPEG XL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libjxl-tools

      - name: Download pinned historic originals and convert to real JXL
        run: bash scripts/import-chirp-flock-images.sh

      - name: Commit verified JPEG XL images on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/2018/01/chirp-flock/*.jxl
          if git diff --cached --quiet; then
            echo 'JXL assets are already up to date.'
          else
            git commit -m 'assets(chirp): import verified original flock JXL photos'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
