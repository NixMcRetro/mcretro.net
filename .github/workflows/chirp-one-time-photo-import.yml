name: One-time original Channel Chirp welcome photo import

on:
  push:
    branches:
      - feat/chirp-nest-original-photo

permissions:
  contents: write

jobs:
  convert-welcome-photo:
    if: "!contains(github.event.head_commit.message, '[chirp-photo-generated]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/chirp-nest-original-photo
          persist-credentials: true
      - name: Install JPEG XL and image metadata tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libjxl-tools libimage-exiftool-perl
      - name: Import pinned original photo and strip metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/ChannelChirp/website/4bb407a15f29cb75000d4ef636d441af009b2a48/images/frontpage.jpg" \
            --output /tmp/chirp-frontpage.jpg
          test "$(file --brief --mime-type /tmp/chirp-frontpage.jpg)" = "image/jpeg"
          exiftool -all= -overwrite_original /tmp/chirp-frontpage.jpg
          mkdir -p assets/images/2019/01/channel-chirp-nest
          cjxl /tmp/chirp-frontpage.jpg assets/images/2019/01/channel-chirp-nest/frontpage.jxl -e 7
          jxlinfo assets/images/2019/01/channel-chirp-nest/frontpage.jxl
          test -s assets/images/2019/01/channel-chirp-nest/frontpage.jxl
          echo "Output size: $(wc -c < assets/images/2019/01/channel-chirp-nest/frontpage.jxl) bytes"
          echo "Metadata review:"
          exiftool -a -G1 -s assets/images/2019/01/channel-chirp-nest/frontpage.jxl
      - name: Commit only the cleaned JPEG XL
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/2019/01/channel-chirp-nest/frontpage.jxl
          if git diff --cached --quiet; then
            echo "Already imported"
          else
            git commit -m "[chirp-photo-generated] Import original frontpage as clean JPEG XL"
            git push origin HEAD:feat/chirp-nest-original-photo
          fi
