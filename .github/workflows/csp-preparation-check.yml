name: McRetro CSP Preparation Checks

on:
  push:
    branches:
      - main
      - security/csp-preparation-2026-10-24
      - security/random-post-no-inline-2026-10-24
      - security/footer-csp-workflow-main-2026-10-24
      - security/csp-fast-checks-2026-10-25
    paths:
      - '_includes/footer.html'
      - 'assets/css/style.css'
      - '_layouts/default.html'
      - '_includes/sidebar.html'
      - 'Gemfile.lock'
      - 'assets/js/archive-dropdown.js'
      - '.github/tests/archive-dropdown.mjs'
      - '.github/tests/script-tags.mjs'
      - '.github/tests/script-tags.test.mjs'
      - 'search/index.html'
      - 'assets/js/mobile-navigation.js'
      - 'assets/js/search-page.js'
      - 'assets/js/random-post.js'
      - 'assets/data/random-post-urls.json'
      - '.github/tests/random-post.mjs'
      - '.github/tests/csp-preparation.mjs'
      - '.github/tests/footer-csp.mjs'
      - '.github/tests/footer-csp-built.mjs'
      - '.github/tests/csp-built.mjs'
      - '.github/workflows/csp-preparation-check.yml'
      - '.github/workflows/jekyll.yml'
  pull_request:
    paths:
      - '_includes/footer.html'
      - 'assets/css/style.css'
      - '.github/tests/footer-csp.mjs'
      - '.github/tests/footer-csp-built.mjs'
      - '.github/tests/csp-built.mjs'
      - '_layouts/default.html'
      - '_includes/sidebar.html'
      - 'Gemfile.lock'
      - 'assets/js/archive-dropdown.js'
      - '.github/tests/archive-dropdown.mjs'
      - '.github/tests/script-tags.mjs'
      - '.github/tests/script-tags.test.mjs'
      - 'search/index.html'
      - 'assets/js/mobile-navigation.js'
      - 'assets/js/search-page.js'
      - 'assets/js/random-post.js'
      - 'assets/data/random-post-urls.json'
      - '.github/tests/random-post.mjs'
      - '.github/tests/csp-preparation.mjs'
      - '.github/workflows/csp-preparation-check.yml'
      - '.github/workflows/jekyll.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/mobile-navigation.js
          node --check assets/js/search-page.js
          node --check assets/js/random-post.js
          node --check assets/js/archive-dropdown.js
          node --check .github/tests/script-tags.mjs
          node --check .github/tests/csp-built.mjs
      - name: Run footer, navigation, search and random-post regression tests
        run: node --test .github/tests/csp-preparation.mjs .github/tests/random-post.mjs .github/tests/footer-csp.mjs .github/tests/archive-dropdown.mjs .github/tests/script-tags.test.mjs

  # Full integration checks remain available on security review branches and on
  # manual dispatch, without repeating the production Jekyll/Pagefind build.
  integration:
    if: github.event_name == 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build Jekyll
        run: bundle exec jekyll build --destination _site
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked Pagefind dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Pagefind index
        run: ./node_modules/.bin/pagefind --site _site --output-subdir pagefind
      - name: Verify generated site CSP requirements
        run: node .github/tests/csp-built.mjs _site
