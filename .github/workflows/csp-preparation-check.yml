name: McRetro CSP Preparation Checks

on:
  push:
    branches:
      - main
      - security/csp-preparation-2026-10-24
      - security/random-post-no-inline-2026-10-24
      - security/footer-csp-workflow-main-2026-10-24
    paths:
      - '_includes/footer.html'
      - 'assets/css/style.css'
      - '_layouts/default.html'
      - 'search/index.html'
      - 'assets/js/mobile-navigation.js'
      - 'assets/js/search-page.js'
      - 'assets/js/random-post.js'
      - 'assets/data/random-post-urls.json'
      - '.github/tests/random-post.mjs'
      - '.github/tests/csp-preparation.mjs'
      - '.github/tests/footer-csp.mjs'
      - '.github/tests/footer-csp-built.mjs'
      - '.github/workflows/csp-preparation-check.yml'
  pull_request:
    paths:
      - '_includes/footer.html'
      - 'assets/css/style.css'
      - '.github/tests/footer-csp.mjs'
      - '.github/tests/footer-csp-built.mjs'
      - '_layouts/default.html'
      - 'search/index.html'
      - 'assets/js/mobile-navigation.js'
      - 'assets/js/search-page.js'
      - 'assets/js/random-post.js'
      - 'assets/data/random-post-urls.json'
      - '.github/tests/random-post.mjs'
      - '.github/tests/csp-preparation.mjs'
      - '.github/workflows/csp-preparation-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/mobile-navigation.js
          node --check assets/js/search-page.js
          node --check assets/js/random-post.js
      - name: Run footer, navigation, search and random-post regression tests
        run: node --test .github/tests/csp-preparation.mjs .github/tests/random-post.mjs .github/tests/footer-csp.mjs
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build Jekyll
        run: bundle exec jekyll build --destination _site
      - name: Install locked Pagefind dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Pagefind index
        run: ./node_modules/.bin/pagefind --site _site --output-subdir pagefind
      - name: Verify generated site assets
        run: |
          test -s _site/assets/js/mobile-navigation.js
          test -s _site/assets/js/search-page.js
          test -s _site/assets/js/random-post.js
          test -s _site/assets/data/random-post-urls.json
          node -e 'const fs=require("node:fs"); const urls=JSON.parse(fs.readFileSync("_site/assets/data/random-post-urls.json", "utf8")); if (!Array.isArray(urls) || !urls.length || !urls.every(url => typeof url === "string" && url.startsWith("/") && !url.startsWith("//"))) process.exit(1)'
          test -s _site/search/index.html
          test -s _site/pagefind/pagefind-ui.js
          grep -Fq '/assets/js/search-page.js' _site/search/index.html
          grep -Fq '/assets/js/mobile-navigation.js' _site/index.html
          grep -Fq '/assets/js/random-post.js' _site/index.html
          node .github/tests/footer-csp-built.mjs _site/index.html
          if grep -qE '<script[^>]*>[[:space:]]*[^<[:space:]]' _site/index.html; then
            echo "Found inline script in homepage" >&2
            exit 1
          fi
