name: Goodies Copy Trial

on:
  push:
    branches:
      - test/goodies-copy-layout-tidy-2026-10-25

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Goodies content regression checks
        run: node --test .github/tests/goodies-copy-trial.mjs
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build Jekyll
        run: bundle exec jekyll build --destination _site
      - name: Locate and inspect generated Goodies page
        run: |
          find _site -maxdepth 3 -iname '*goodies*' -print
          if [ -s _site/goodies/index.html ]; then
            GOODIES=_site/goodies/index.html
          elif [ -s _site/goodies.html ]; then
            GOODIES=_site/goodies.html
          else
            echo "Built Goodies file missing" >&2
            exit 1
          fi
          echo "Checking $GOODIES"
          grep -inE 'floppy|filecopy|under construction' "$GOODIES" | head -30
          grep -Fq 'copy that floppy!' "$GOODIES"
          grep -Fq 'filecopy.gif' "$GOODIES"
          grep -Fq 'Still Under Construction' "$GOODIES"
          ! grep -Fq 'No point pretending those pages are finished!' "$GOODIES"
          ! grep -Fq 'The restored homepages and browser projects have found a home here too.' "$GOODIES"
      - name: Report remaining third-party asset references
        run: node .github/tests/external-dependencies-report.mjs _site
