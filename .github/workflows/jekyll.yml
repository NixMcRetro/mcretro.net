name: Deploy Jekyll site with Pagefind

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - '.github/*.md'
      - '.github/tests/**'
      - '.github/workflows/link-audit.yml'
      - '.github/workflows/op1-browser-tests.yml'
  pull_request:
    paths:
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'homepages/vrampage-md/**'
      - '_config.yml'
      - '.github/workflows/jekyll.yml'
      - '.github/tests/vrampage-deployment.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build site with Jekyll
        run: bundle exec jekyll build --destination _site

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Pagefind
        run: npm ci --no-audit --no-fund

      - name: Verify VRAMpage release files survive Jekyll unchanged
        run: node .github/tests/vrampage-deployment.mjs _site

      - name: Run Pagefind
        run: ./node_modules/.bin/pagefind --site _site --output-subdir pagefind

      - name: Verify generated site CSP requirements
        run: node .github/tests/csp-built.mjs _site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
