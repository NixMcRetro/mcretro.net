name: Deploy Jekyll site with Pagefind

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - '.github/*.md'
      - '.github/workflows/link-audit.yml'
      - '.github/workflows/op1-browser-tests.yml'
  pull_request:
    paths:
      - '_posts/**'
      - 'blog/index.html'
      - 'archive/index.html'
      - '_includes/header.html'
      - '_includes/auto-thumbnail.html'
      - '_includes/post-share.html'
      - '_layouts/archive.html'
      - '_plugins/without_media_captions.rb'
      - '.github/tests/caption-excerpts.test.rb'
      - '.github/tests/caption-excerpts-built.mjs'
      - 'assets/css/**'
      - 'assets/js/theme.js'
      - 'assets/js/sticky-navigation.js'
      - '.github/tests/sticky-navigation.test.mjs'
      - 'assets/js/post-media-layout.js'
      - '_plugins/image_dimensions.rb'
      - '.github/tests/post-media-built-check.mjs'
      - 'about.md'
      - 'channels.md'
      - 'chirp/**'
      - '_includes/channel-chirp-nav.html'
      - '_includes/channel-chirp-sidebar.html'
      - '_includes/channel-chirp-archive-list.html'
      - '_includes/channel-chirp-blog-roll.html'
      - '_plugins/channel_chirp_adventures.rb'
      - 'assets/js/channel-chirp-filter.js'
      - 'assets/js/channel-chirp-archive.js'
      - 'assets/data/chirp-random.json'
      - 'assets/js/channel-chirp-random.js'
      - '.github/tests/channel-chirp-built.mjs'
      - '.github/tests/chirp-random.test.mjs'
      - '.github/tests/chirp-calendar.test.mjs'
      - 'goodies.md'
      - 'homepages/geocities/**'
      - '.github/tests/geocities-built.mjs'
      - 'homepages/fishtankworld/**'
      - 'homepages/goatpad/**'
      - '.github/tests/restore-fishtank-gallery.py'
      - '.github/tests/goatpad-audio.test.mjs'
      - '.github/tests/goodies-directory-built.mjs'
      - '.github/tests/theme.mjs'
      - '.github/tests/archive-calendar.mjs'
      - '.github/tests/verify-goatpad-opus.py'
      - '.github/tests/fishtankworld-built.mjs'
      - '_layouts/default.html'
      - '_includes/sidebar.html'
      - 'assets/js/archive-calendar.js'
      - 'assets/js/mcretro-dialup.js'
      - 'assets/js/header-taglines.js'
      - '.github/tests/modem-destinations.mjs'
      - '.github/tests/archive-calendar.mjs'
      - '.github/tests/archive-calendar-built.mjs'
      - '.github/tests/csp-built.mjs'
      - '_includes/exclusive-panel-visibility.html'
      - 'assets/js/accordion-navigation.js'
      - '.github/tests/check-accordion-navigation.mjs'
      - 'homepages/vrampage-md/**'
      - '_config.yml'
      - '.github/workflows/jekyll.yml'
      - '.github/tests/vrampage-deployment.mjs'
      - '.github/tests/vrampage-release-asset.sh'
      - '.github/tests/vrampage-package.py'
      - '.github/tests/vrampage-package.test.py'
      - '.github/tests/vrampage-live.py'
      - '.github/tests/vrampage-live.test.py'
      - '_posts/*-take-back-the-darknet-part-*.md'
      - 'assets/images/2016/01/take-back-the-darknet/**'
      - 'assets/js/darknet-accordion.js'
      - '.github/vrampage-release.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  release-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the approved VRAMpage package and verification tools
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /homepages/vrampage-md/
            /.github/tests/vrampage-release-asset.sh
            /.github/tests/vrampage-package.py
            /.github/vrampage-release.json

      - name: Require the exact public corresponding-source release
        run: bash .github/tests/vrampage-release-asset.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Verify the approved standalone package and deployment checks
        run: |
          python3 .github/tests/vrampage-package.py
          python3 .github/tests/vrampage-package.test.py
          python3 .github/tests/vrampage-live.test.py

      - name: Verify caption filtering with Ruby regression tests
        run: bundle exec ruby .github/tests/caption-excerpts.test.rb

      - name: Reassemble and check original Fish Tank World gallery photographs
        run: python3 .github/tests/restore-fishtank-gallery.py

      - name: Build site with Jekyll
        run: bundle exec jekyll build --destination _site

      - name: Ensure private R2 archive source files never enter public site
        run: |
          if test -e _site/archive-sites; then
            echo "::error::archive-sites source or test files must not be published on mcretro.net"
            exit 1
          fi

      # Only approved month pages computed from released Bird articles may
      # exist under /chirp/archive/. Reject any retired historical snapshot.
      - name: Enforce released-only Channel Chirp archive boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          
          root = Path("_site/chirp/archive")
          catalogue = json.loads(Path("_site/assets/data/chirp-random.json").read_text(encoding="utf-8"))
          dates = [post["date"] for post in catalogue]
          if not dates or any(not re.fullmatch(r"\d{4}-\d{2}-\d{2}", date) for date in dates):
              raise SystemExit("Invalid released Channel Chirp catalogue")
          months = {(date[:4], date[5:7]) for date in dates}
          approved = {root, root / "index.html"}
          approved.update(root / year for year, month in months)
          approved.update(root / year / month for year, month in months)
          approved.update(root / year / month / "index.html" for year, month in months)
          actual = {root} | set(root.rglob("*"))
          extra = sorted(actual - approved)
          missing = sorted(approved - actual)
          symlinks = sorted(path for path in actual if path.is_symlink())
          if extra or missing or symlinks:
              raise SystemExit(f"Unapproved Bird archive output: extra={extra}, missing={missing}, symlinks={symlinks}")
          print(f"PASS: Only released Bird archive index and {len(months)} monthly pages are published")
          PY

      - name: Verify committed GOATPAD 24 kbps Opus audio and MIT notice
        run: python3 .github/tests/verify-goatpad-opus.py --site _site

      - name: Verify all restored photographs are present in the built site
        run: python3 .github/tests/restore-fishtank-gallery.py --verify-built _site

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify Fish Tank World pages and built-site internal links
        run: node .github/tests/fishtankworld-built.mjs _site

      - name: Verify Channel Chirp Nest posts, navigation and theme isolation
        run: |
          node --check assets/js/channel-chirp-filter.js
          node --check assets/js/channel-chirp-archive.js
          node --check assets/js/channel-chirp-random.js
          node --test .github/tests/chirp-random.test.mjs .github/tests/chirp-calendar.test.mjs
          node .github/tests/channel-chirp-built.mjs _site

      - name: Verify Goodies projects and restored homepages remain reachable
        run: node .github/tests/goodies-directory-built.mjs _site

      - name: Verify restored GeoCities pages render Markdown and preserve original artwork
        run: node .github/tests/geocities-built.mjs _site

      - name: Check blog image dimension markers and enlargement script
        run: |
          node --check assets/js/post-media-layout.js
          node .github/tests/post-media-built-check.mjs _site

      - name: Verify GOATPAD audio startup, sample loading and sequencer behaviour
        run: node --test --test-name-pattern='^core:' .github/tests/goatpad-audio.test.mjs

      - name: Verify theme and accessibility behaviour (required)
        run: node --test --test-name-pattern='^core:' .github/tests/theme.mjs

      - name: Verify sticky desktop and mobile navigation (required)
        run: |
          node --check assets/js/sticky-navigation.js
          node --test .github/tests/sticky-navigation.test.mjs

      - name: Verify dial-up and archive calendar interactions (required)
        run: node --test .github/tests/modem-destinations.mjs .github/tests/archive-calendar.mjs

      - name: Verify generated blog, archives, metadata and feed captions
        run: node .github/tests/caption-excerpts-built.mjs _site

      - name: Verify published archive calendar counts against monthly archive pages
        run: node .github/tests/archive-calendar-built.mjs _site

      - name: Verify shared accordion navigation across published pages
        run: node .github/tests/check-accordion-navigation.mjs _site

      # CSS/layout details are advisory. Preserve their signal without blocking
      # publishing when an editor legitimately changes the visual design.
      - name: Advisory visual consistency checks (non-blocking)
        continue-on-error: true
        run: node --test --test-name-pattern='^advisory:' .github/tests/theme.mjs

      - name: Advisory GOATPAD appearance checks (non-blocking)
        continue-on-error: true
        run: node --test --test-name-pattern='^advisory:' .github/tests/goatpad-audio.test.mjs

      - name: Install Pagefind
        run: npm ci --no-audit --no-fund

      - name: Verify VRAMpage release files survive Jekyll unchanged
        run: node .github/tests/vrampage-deployment.mjs _site

      - name: Run Pagefind
        run: ./node_modules/.bin/pagefind --site _site --output-subdir pagefind --force-language en

      - name: Verify generated site CSP requirements
        run: node .github/tests/csp-built.mjs _site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, release-source]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Checkout only the approved VRAMpage package for live verification
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /homepages/vrampage-md/
            /.github/tests/vrampage-live.py

      - name: Verify live VRAMpage runtime, cartridges and source
        run: python3 .github/tests/vrampage-live.py
