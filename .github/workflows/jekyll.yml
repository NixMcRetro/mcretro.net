name: Deploy Jekyll site with Pagefind

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - '.github/*.md'
      - '.github/tests/**'
      - '.github/workflows/link-audit.yml'
      - '.github/workflows/op1-browser-tests.yml'
  pull_request:
    paths:
      - 'homepages/vrampage-md/**'
      - '_config.yml'
      - '.github/workflows/jekyll.yml'
      - '.github/tests/vrampage-deployment.mjs'
      - '.github/tests/vrampage-release-asset.sh'
      - '.github/tests/vrampage-package.py'
      - '.github/tests/vrampage-package.test.py'
      - '.github/tests/vrampage-live.py'
      - '.github/tests/vrampage-live.test.py'
      - '.github/vrampage-release.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  release-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the approved VRAMpage package and verification tools
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /homepages/vrampage-md/
            /.github/tests/vrampage-release-asset.sh
            /.github/tests/vrampage-package.py
            /.github/vrampage-release.json

      - name: Require the exact public corresponding-source release
        run: bash .github/tests/vrampage-release-asset.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Verify the approved standalone package and deployment checks
        run: |
          python3 .github/tests/vrampage-package.py
          python3 .github/tests/vrampage-package.test.py
          python3 .github/tests/vrampage-live.test.py

      - name: Build site with Jekyll
        run: bundle exec jekyll build --destination _site

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Pagefind
        run: npm ci --no-audit --no-fund

      - name: Verify VRAMpage release files survive Jekyll unchanged
        run: node .github/tests/vrampage-deployment.mjs _site

      - name: Run Pagefind
        run: ./node_modules/.bin/pagefind --site _site --output-subdir pagefind

      - name: Verify generated site CSP requirements
        run: node .github/tests/csp-built.mjs _site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, release-source]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Checkout only the approved VRAMpage package for live verification
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /homepages/vrampage-md/
            /.github/tests/vrampage-live.py

      - name: Verify live VRAMpage runtime, cartridges and source
        run: python3 .github/tests/vrampage-live.py
