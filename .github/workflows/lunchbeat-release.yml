name: Release Lunchbeat Web v1.0.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lunchbeat-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lunchbeat-web-v1.0.0
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: 7dca53b36ab118bc5a073dec6aefc990321c2976
      RELEASE_TAG: lunchbeat-web-v1.0.0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 7dca53b36ab118bc5a073dec6aefc990321c2976
          persist-credentials: false
          sparse-checkout: homepages/lunchbeat
      - name: Prepare exact standalone HTML and licence files
        run: |
          mkdir -p release
          cp homepages/lunchbeat/index.html release/Lunchbeat-Web-v1.0.0.html
          cp homepages/lunchbeat/{README.md,LICENSE.txt,LICENSING.md} release/
          cd release
          sha256sum Lunchbeat-Web-v1.0.0.html README.md LICENSE.txt LICENSING.md > SHA256SUMS.txt
      - name: Install offline browser test dependencies
        run: |
          python3 -m pip install --user playwright==1.51.0
          python3 -m playwright install --with-deps chromium
      - name: Smoke test local HTML with networking disabled
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(args=['--autoplay-policy=no-user-gesture-required'])
              context = browser.new_context(offline=True, viewport={'width': 1440, 'height': 900})
              page = context.new_page()
              errors = []
              page.on('pageerror', lambda error: errors.append(str(error)))
              page.goto(Path('release/Lunchbeat-Web-v1.0.0.html').resolve().as_uri())
              page.locator('[data-part=demoButton4]').click()
              assert '52 BPM' in page.locator('[data-part=tempoText]').inner_text()
              page.locator('[data-part=enableAudio]').click()
              page.wait_for_function("document.querySelector('[data-part=statusText]').textContent==='AUDIO READY'")
              page.locator('[data-part=playButton]').click()
              page.wait_for_function("document.querySelector('[data-part=stepText]').textContent!=='01 / 08'")
              page.locator('#addLunchbeat').click()
              page.locator('#viewToggle').click()
              assert page.locator('#rack .rack-unit:visible').count() == 1
              assert not errors, errors
              browser.close()
          PY
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; immutable assets left unchanged."
            exit 0
          fi
          cat > /tmp/lunchbeat-release-notes.md <<'EOF'
          Initial stable release of Lunchbeat Web, adapted by Nix McRetro from Jan Cumpelik's Lunchbeat PCB v1.31.

          Download **Lunchbeat-Web-v1.0.0.html** and open it in a browser. No installation or internet connection is required to play. Enable audio, select a groove and press PLAY.

          Includes the photo-inspired purple PCB, four sound generators, eight-step sequencer, four presets, linked boards, optional tabs and automatic/manual light and dark modes. The application code is GPL-3.0-only; the PCB illustration is CC BY-SA 3.0. The separate mascot artwork is excluded from both licence grants; its provenance and redistribution permission remain unverified. See LICENSING.md.

          The release HTML is copied unchanged from the approved website commit. SHA256SUMS.txt contains checksums for the downloadable files.

          [Play online](https://mcretro.net/homepages/lunchbeat/)
          EOF
          gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --title 'Lunchbeat Web v1.0.0' --notes-file /tmp/lunchbeat-release-notes.md --latest=false
