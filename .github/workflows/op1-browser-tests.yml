permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium firefox webkit
      - name: BleepGarden v2.9 arranged MIDI export, tracker and musicality
        run: node .github/tests/bleepgarden-midi-musicality-v29.mjs
      - name: BleepGarden name, credit, install metadata and compatible engine
        run: node .github/tests/op1-bleepgarden-branding.mjs
      - name: v2.8 Stage 4 beginner finish and graphite theme regression
        run: node .github/tests/op1-finish-darkmode-v28.mjs
      - name: v2.8 Stage 3 visual song-section editing and compatibility
        run: node .github/tests/op1-song-sections-v28.mjs
      - name: v2.8 record riffs, adjust sections and preserve projects
        run: node .github/tests/op1-riff-recorder-v28.mjs
      - name: v2.7.1 beginner Casio keyboard and legacy engine regression
        run: node .github/tests/op1-casio-keyboard-v271.mjs
      - name: v2.7 Stage 5 beginner finish and resume workflow
        run: node .github/tests/op1-song-finishing-v27.mjs
      - name: v2.7 Stage 4 sound shaping, A/B, Undo and WAV regression
        run: node .github/tests/op1-sound-shaping-v27.mjs
      - name: v2.7 beginner generator, editable remix and backup regression
        run: node .github/tests/op1-music-maker-v27.mjs
      - name: v2.6 Stage 4 finished song stereo WAV and backup regression
        run: node .github/tests/op1-song-finish-v26.mjs
      - name: v2.6 Stage 3 visual timeline and starter patterns regression
        run: node .github/tests/op1-song-timeline-v26.mjs
      - name: v2.6 Stage 2 editable live song arrangement regression
        run: node .github/tests/op1-song-arrangement-v26.mjs
      - name: v2.6 Song Builder start screen regression
        run: node .github/tests/op1-song-builder-start.mjs
      - name: v2.5 Sound Design and Focus regression
        run: node .github/tests/op1-tracker-v25.mjs
      - name: v2.4 Performance and Arrangement regression
        run: node .github/tests/op1-tracker-performance.mjs
      - name: v2.3 Tracker Music-Making Update regression
        run: node .github/tests/op1-tracker-music-making.mjs
      - name: v2.2 Tracker Studio browser and project regression
        run: node .github/tests/op1-tracker-studio.mjs
      - name: v2.1 Simple and Advanced workspace, mobile and project regression
        run: node .github/tests/op1-studio-simplified.mjs
      - name: v2.0.2 musical arrangement, safe feedback and drum integrity regression
        run: node .github/tests/op1-demo-arrangements.mjs
      - name: v2.0.1 Studio Comfort, MIDI routing, demos, Retina and tabs regression
        run: node .github/tests/op1-studio-comfort.mjs
      - name: v2.0 Unified Song Workspace cross-browser, WAV, tape and recovery regression
        run: node .github/tests/op1-unified-song.mjs
      - name: v1.9 Piano Roll Studio, MIDI/polyphony and live recording regression
        run: node .github/tests/op1-piano-roll-studio.mjs
      - name: Chromium, Firefox and WebKit regression checks
        run: node .github/tests/op1-browser-smoke.mjs
      - name: Tape Studio PCM and varispeed regression (Chromium)
        run: node .github/tests/op1-tape-studio.mjs
      - name: Performance Studio browser, chain and capture regressions
        run: node .github/tests/op1-performance-studio.mjs
      - name: Sampling Workshop and legacy project audio regression
        run: node .github/tests/op1-sampling-workshop.mjs
      - name: Pianola Composer, original sound slots and song compatibility regression
        run: node .github/tests/op1-pianola-composer.mjs
      - name: Pianola MIDI/JSON interchange and Synth Note Player regression
        run: node .github/tests/op1-score-interchange.mjs
      - name: Offline installation and reload regression (Chromium)
        run: node .github/tests/op1-pwa-offline.mjs
      - name: Archive BleepGarden v2.8 named release candidate
        uses: actions/upload-artifact@v4
        with:
          name: bleepgarden-v2.9-midi-tracker-source-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            homepages/op-1/
            .github/tests/op1-browser-smoke.mjs
            .github/tests/op1-tape-studio.mjs
            .github/tests/op1-pwa-offline.mjs
            .github/tests/op1-performance-studio.mjs
            .github/tests/op1-sampling-workshop.mjs
