name: Validate R2 Photo Gallery source
on:
  pull_request:
    paths:
      - 'archive-sites/**'
      - '.github/tests/r2-photo-gallery.test.mjs'
      - '.github/workflows/r2-archive-sites.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Rich for terminal dashboard regression tests
        run: python -m pip install 'rich>=13.9,<15'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify Photo Gallery catalogue and JavaScript
        run: node --test .github/tests/r2-photo-gallery.test.mjs
      - name: Validate Photo Gallery Python helpers with synthetic fixtures
        run: python3 -m unittest discover -s archive-sites/tools -p 'test_*.py' -v
