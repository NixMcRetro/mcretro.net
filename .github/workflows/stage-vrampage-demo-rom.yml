name: Stage verified VRAMpage Demo Cart v0.3.8

on:
  push:
    branches:
      - feat/vrampage-demo-cart-038-standalone-20261111
    paths:
      - .github/workflows/stage-vrampage-demo-rom.yml

permissions:
  contents: write

jobs:
  stage-rom:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the website branch
        uses: actions/checkout@v4
        with:
          ref: feat/vrampage-demo-cart-038-standalone-20261111
          persist-credentials: true
      - name: Extract and verify the official v0.3.8 ROM
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/NixMcRetro/VRAMpage-MD/releases/download/v0.5.2/VRAMpage-MD-v0.5.2-browser.zip"
          rom_path="$(unzip -Z1 "$archive" | grep -E '(^|/)demo/VRAMpage-MD-Demo-Cart-v0[.]3[.]8[.]bin$')"
          test "$(printf '%s\n' "$rom_path" | wc -l)" -eq 1
          dest="assets/downloads/2026/10/vrampage-md/VRAMpage-MD-Demo-Cart-v0.3.8.bin"
          unzip -p "$archive" "$rom_path" > "$dest"
          printf '%s  %s\n' \
            "1baf324f8f997029513cea9855856148589df91882e7ae5d0c2a3b8906da5ffc" "$dest" | sha256sum --check --status
          test "$(wc -c < "$dest")" -eq 167720
          echo "Verified Demo Cart v0.3.8: 167,720 bytes; SHA-256 matches the official release"
      - name: Commit verified ROM to the website branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/downloads/2026/10/vrampage-md/VRAMpage-MD-Demo-Cart-v0.3.8.bin
          git diff --cached --quiet && exit 0
          git commit -m "Stage verified Demo Cart v0.3.8 ROM"
          git push origin HEAD:feat/vrampage-demo-cart-038-standalone-20261111
