<div class="mcretro-modem-card">
  <div class="mcretro-modem-titlebar">
    <span>☎ Dial-Up Networking</span>
    <span aria-hidden="true">□ ×</span>
  </div>
  <div class="mcretro-modem-body">
    <p class="mcretro-modem-caption">Connecting to the McRetro Network</p>
    <img class="mcretro-modem-photo" src="/homepages/nature/images/placeholder.jpg" alt="Historical placeholder image from Super Nature World. Modem photograph coming soon." loading="eager" decoding="async">
    <p class="mcretro-modem-destination">Destination: <strong data-modem-destination>Restored homepage</strong></p>
    <pre class="mcretro-modem-status" data-modem-status role="status" aria-live="polite">READY
Press Connect to dial, or Skip to visit immediately.</pre>
    <div class="mcretro-modem-controls">
      <button type="button" data-modem-connect>Connect</button>
      <button type="button" data-modem-mute aria-pressed="false">Mute</button>
      <button type="button" data-modem-skip>Skip</button>
      <a href="/" data-modem-cancel>Cancel</a>
    </div>
    <p class="mcretro-modem-note">No real modem connection is made. Sound is generated locally.</p>
  </div>
</div>
