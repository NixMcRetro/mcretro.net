{% assign share_post_url = page.url | absolute_url %}
{% capture share_post_text %}{{ page.title }} — {{ share_post_url }}{% endcapture %}
<section class="post-share" aria-labelledby="post-share-heading" data-pagefind-ignore="all">
  <h2 id="post-share-heading">Share This Post</h2>
  <div class="post-share__links">
    <a class="post-share__action" href="https://bsky.app/intent/compose?text={{ share_post_text | url_encode }}" target="_blank" rel="noopener noreferrer">
      <span class="post-share__icon" aria-hidden="true">🦋</span> Bluesky
    </a>
    <a class="post-share__action" href="https://share.joinmastodon.org/#text={{ share_post_text | url_encode }}" target="_blank" rel="noopener noreferrer">
      <span class="post-share__icon" aria-hidden="true">🐘</span> Mastodon
    </a>
    <a class="post-share__action" href="https://www.tumblr.com/widgets/share/tool?canonicalUrl={{ share_post_url | url_encode }}&amp;posttype=link&amp;title={{ page.title | url_encode }}&amp;content={{ share_post_url | url_encode }}" target="_blank" rel="noopener noreferrer">
      <span class="post-share__icon post-share__icon--tumblr" aria-hidden="true">t</span> Tumblr
    </a>
    <a class="post-share__action" href="mailto:?subject={{ page.title | url_encode }}&amp;body={{ share_post_text | url_encode }}">
      <span class="post-share__icon" aria-hidden="true">✉</span> Email
    </a>
    <button class="post-share__action" type="button" data-copy-post-link data-url="{{ share_post_url | escape }}">
      <span class="post-share__icon" aria-hidden="true">🔗</span> <span data-copy-label>Copy Link</span>
    </button>
  </div>
  <p class="post-share__feedback visually-hidden" data-copy-status role="status" aria-live="polite" aria-atomic="true"></p>
  <p class="post-share__subscribe">📡 Enjoyed this post? <a href="{{ '/feed.xml' | relative_url }}">Subscribe via RSS</a> for new ones.</p>
</section>
