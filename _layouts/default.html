<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon/favicon-16x16.png' | relative_url }}?v=20261018b">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon/favicon-32x32.png' | relative_url }}?v=20261018b">
  <link rel="icon" type="image/png" sizes="96x96" href="{{ '/assets/favicon/favicon-96x96.png' | relative_url }}?v=20261018b">
  <link rel="shortcut icon" href="{{ '/assets/favicon/favicon.ico' | relative_url }}?v=20261018b">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/favicon/apple-touch-icon.png' | relative_url }}?v=20261018b">
  <link rel="manifest" href="{{ '/assets/favicon/site.webmanifest' | relative_url }}?v=20261018b">
  <meta name="theme-color" content="#FFF8DC">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.type == 'month' %}{{ page.date | date: "%B %Y" }}{% elsif page.title %}{{ page.title }}{% endif %} - {{ site.title }}</title>
  <meta data-pagefind-meta="title[content]" content="{% if page.type == 'month' %}{{ page.date | date: "%B %Y" }}{% elsif page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
  <!-- Blocking external script: resolves system/manual preference before first paint (CSP safe). -->
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/overrides.css">
  <script src="{{ '/assets/js/accordion-navigation.js' | relative_url }}" defer></script>
  {% feed_meta %}
  {% seo %}
</head>
<body {% if page.pagefind == false %}data-pagefind-ignore="all" {% endif %}{% if page.date %}data-archive-context-year="{{ page.date | date: '%Y' }}"{% endif %}>
  {% include header.html %}
  <script src="{{ '/assets/js/header-taglines.js' | relative_url }}"></script>
  <div class="site-content">
    <main class="content-area">
      {{ content }}
    </main>
    <aside class="sidebar" data-pagefind-ignore="all">
      {% include_cached sidebar.html %}
    </aside>
  </div>
  {% include footer.html %}
  <button type="button" id="mcretro-modem-taskbar" class="mcretro-modem-taskbar" hidden aria-label="Restore McRetro Dial-Up Connection">☎ McRetro.net Dial-Up - 28,800 bps</button>

<script src="{{ '/assets/js/runner.js' | relative_url }}"></script>
<script src="{{ '/assets/js/mcretro-dialup.js' | relative_url }}"></script>

<script src="{{ '/assets/js/archive-calendar.js' | relative_url }}"></script>
<script src="{{ '/assets/js/random-post.js' | relative_url }}"></script>

<script src="{{ '/assets/js/mobile-navigation.js' | relative_url }}"></script>

</body>
</html>
