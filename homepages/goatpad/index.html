<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="icon" type="image/png" href="./icon.png">
    <title>GOATPAD 1337</title>
</head>

<body>
    <div id="loadingScreen">
        <div class="loading-inner">
            <button id="startAudio" type="button">Start GOATPAD 1337</button>
            <p id="loadingMessage" role="status" aria-live="polite">Click to prepare the first eight sounds. Other sounds load when selected.</p>
        </div>
    </div>
    <div class="container">
        <div class="column side-column"></div>
        <div class="column soundboard-column">
            <!-- One black cable leaving behind the top of the instrument. -->
            <svg class="goatpad-cable" viewBox="0 0 150 1000" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                <path class="cable-shadow" d="M94 1020 C110 745 75 530 83 315 C94 150 103 74 73 -30"></path>
                <path class="cable-highlight" d="M91 1017 C107 742 72 527 80 312 C91 147 100 71 70 -33"></path>
            </svg>
            <div class="soundboard">
                <div class="sequence-viewport" role="region" aria-label="Eight-column soundboard. Scroll sideways to reach every pad." tabindex="0">
                    <div class="sequence-inner">
                        <div class="metronome" aria-hidden="true">
                            <div class="counter active"></div>
                            <div class="counter"></div>
                            <div class="counter"></div>
                            <div class="counter"></div>
                            <div class="counter"></div>
                            <div class="counter"></div>
                            <div class="counter"></div>
                            <div class="counter"></div>
                        </div>
                        <div class="buttonArea"></div>
                    </div>
                </div>
                <p class="mobile-scroll-hint">Swipe sideways to reach all eight columns.</p>
                <div class="brand-bar">
                    <img class="title" src="./title.png" alt="GOATPAD 1337">
                    <!-- Small three-part circular instrument glyph from the original HUD. -->
                    <svg class="brand-emblem" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                        <circle cx="16" cy="16" r="13" fill="#14111a" stroke="#514b59" stroke-width="1"></circle>
                        <g fill="none" stroke="#f2eff6" stroke-width="3.5" stroke-linecap="round">
                            <path d="M13 7 C8 8 6 12 8 16"></path>
                            <path d="M23 13 C25 18 21 23 17 24"></path>
                            <path d="M9 22 C13 26 19 25 21 21"></path>
                        </g>
                        <circle cx="16" cy="16" r="3" fill="#eae6f0"></circle>
                    </svg>
                </div>
                <div class="goat-controls">
                    <button id="autoGoat" type="button" aria-pressed="false" aria-controls="goatSprite" title="Let a wandering goat choose sounds automatically. Press again to keep the current mix." disabled>🐐 Auto Goat: Off</button>
                </div>
                <p id="audioStatus" role="status" aria-live="polite"></p>
                <p class="goatpad-credit">Fan recreation by <a href="https://github.com/insertusernamed/Goatpad-1337">insertusernamed</a> · Based on Goat MMO Simulator · <a href="./LICENSE">MIT licence</a></p>
            </div>
        </div>
        <div class="column side-column"></div>
    </div>
    <div id="goatSprite" class="goat-sprite" aria-hidden="true" hidden><span class="goat-glyph">🐐</span></div>
    <script src="./main.js"></script>
</body>

</html>
