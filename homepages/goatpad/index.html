<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="icon" type="image/png" href="./icon.png">
    <title>GOATPAD 1337</title>
</head>

<body>
    <div class="container">
        <div class="column side-column"></div>
        <div class="column soundboard-column">
            <!-- One sinuous black cable, disappearing beyond the viewport above the instrument. -->
            <svg class="goatpad-cable" viewBox="0 0 220 1000" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                <path class="cable-shadow" d="M140 1030 C200 935 55 840 130 750 C210 655 55 555 133 450 C210 355 45 245 138 145 C185 90 98 30 145 -50"></path>
                <path class="cable-highlight" d="M137 1030 C197 935 52 840 127 750 C207 655 52 555 130 450 C207 355 42 245 135 145 C182 90 95 30 142 -50"></path>
            </svg>
            <div class="soundboard">
                <div class="sequence-frame">
                    <div class="sequence-viewport" role="region" aria-label="Eight-column soundboard. Scroll sideways to reach every pad." tabindex="0" inert>
                        <div class="sequence-inner">
                            <div class="metronome" aria-hidden="true">
                                <div class="counter active"></div>
                                <div class="counter"></div>
                                <div class="counter"></div>
                                <div class="counter"></div>
                                <div class="counter"></div>
                                <div class="counter"></div>
                                <div class="counter"></div>
                                <div class="counter"></div>
                            </div>
                            <div class="buttonArea"></div>
                        </div>
                    </div>
                    <div id="goatStartScreen" class="goat-start-screen">
                        <button id="startAudio" type="button" aria-label="Start GOATPAD music and Auto Goat">🏆 Music Non Stop 🏆</button>
                    </div>
                </div>
                <p class="mobile-scroll-hint">Swipe sideways to reach all eight columns.</p>
                <div class="brand-bar">
                    <img class="title" src="./title.png" alt="GOATPAD 1337">
                    <!-- Small three-part circular instrument glyph from the original HUD. -->
                    <svg class="brand-emblem" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                        <circle cx="16" cy="16" r="13" fill="#14111a" stroke="#514b59" stroke-width="1"></circle>
                        <g fill="none" stroke="#f2eff6" stroke-width="3.5" stroke-linecap="round">
                            <path d="M13 7 C8 8 6 12 8 16"></path>
                            <path d="M23 13 C25 18 21 23 17 24"></path>
                            <path d="M9 22 C13 26 19 25 21 21"></path>
                        </g>
                        <circle cx="16" cy="16" r="3" fill="#eae6f0"></circle>
                    </svg>
                </div>
                <div class="goat-controls">
                    <button id="autoGoat" type="button" aria-pressed="false" aria-controls="goatSprite" title="Let a wandering goat choose sounds automatically. Press again to keep the current mix." disabled hidden>🐐 Auto Goat: Off</button>
                </div>
                <p id="audioStatus" role="status" aria-live="polite"></p>
                <p class="goatpad-credit">Fan recreation by <a href="https://github.com/insertusernamed/Goatpad-1337">insertusernamed</a> · Based on Goat MMO Simulator · <a href="./LICENSE">MIT licence</a></p>
            </div>
        </div>
        <div class="column side-column"></div>
    </div>
    <div id="goatSprite" class="goat-sprite" aria-hidden="true" hidden><span class="goat-glyph">🐐</span></div>
    <script src="./main.js"></script>
</body>

</html>
